<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.28)" />
    </pattern>

    <!-- Centre radial glow -->
    <radialGradient id="heroGlow" cx="62%" cy="50%" r="55%" fx="62%" fy="50%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.055)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </radialGradient>

    <!-- Right-side soft ellipse glow (behind card area) -->
    <radialGradient id="rightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.025)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </radialGradient>

    <!-- Pill gradient -->
    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.18)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)" />
    </linearGradient>

    <!-- YES bar gradient -->
    <linearGradient id="yesGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#16a34a" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <!-- NO bar gradient -->
    <linearGradient id="noGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Card shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="rgba(0,0,0,0.7)" flood-opacity="1" />
    </filter>

    <!-- Logo glow -->
    <filter id="logoGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="1200" height="630" fill="#0d0d0d" />

  <!-- Dot grid -->
  <rect width="1200" height="630" fill="url(#dots)" />

  <!-- Centre radial glow overlay -->
  <rect width="1200" height="630" fill="url(#heroGlow)" />

  <!-- Right ellipse glow behind card -->
  <ellipse cx="900" cy="315" rx="300" ry="260" fill="url(#rightGlow)" />

  <!-- Scan lines (subtle) -->
  <line x1="0" y1="94.5"  x2="1200" y2="94.5"  stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="0" y1="189"   x2="1200" y2="189"   stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="0" y1="283.5" x2="1200" y2="283.5" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="0" y1="378"   x2="1200" y2="378"   stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="0" y1="472.5" x2="1200" y2="472.5" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="240"  y1="0" x2="240"  y2="630" stroke="rgba(255,255,255,0.012)" stroke-width="1"/>
  <line x1="480"  y1="0" x2="480"  y2="630" stroke="rgba(255,255,255,0.012)" stroke-width="1"/>
  <line x1="720"  y1="0" x2="720"  y2="630" stroke="rgba(255,255,255,0.012)" stroke-width="1"/>
  <line x1="960"  y1="0" x2="960"  y2="630" stroke="rgba(255,255,255,0.012)" stroke-width="1"/>

  <!-- Corner accent top-right -->
  <line x1="1200" y1="0" x2="1080" y2="0"   stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <line x1="1200" y1="0" x2="1200" y2="80"  stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- ══════════════════════════════════════
       LEFT COPY  (x: 72, centred vertically)
  ══════════════════════════════════════ -->

  <!-- Q4 Logo mark (scaled up 2×, positioned top-left of copy block) -->
  <g transform="translate(72, 128) scale(2.1)">
    <path fill="#863bff" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"/>
  </g>

  <!-- Q4 wordmark -->
  <text x="175" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="white" letter-spacing="-0.02em">Q4</text>

  <!-- Pill badge -->
  <rect x="72" y="222" width="296" height="30" rx="15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <circle cx="92" cy="237" r="3" fill="rgba(255,255,255,0.5)"/>
  <text x="104" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" letter-spacing="0.01em">Economic Conviction, Not Popularity</text>

  <!-- Headline line 1 -->
  <text x="72" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="white" letter-spacing="-0.045em">Answer Today.</text>

  <!-- Headline line 2 (muted) -->
  <text x="72" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="rgba(255,255,255,0.32)" letter-spacing="-0.045em">Shape Tomorrow.</text>

  <!-- Body copy -->
  <text x="72" y="438" font-family="system-ui, -apple-system, monospace" font-size="15" font-weight="400" fill="rgba(255,255,255,0.5)" letter-spacing="0.01em">Q4 is a prediction platform where your belief is measured</text>
  <text x="72" y="460" font-family="system-ui, -apple-system, monospace" font-size="15" font-weight="400" fill="rgba(255,255,255,0.5)" letter-spacing="0.01em">by economic conviction, not the number of voters.</text>

  <!-- Trust row -->
  <!-- Shield icon -->
  <polyline points="72,506 72,494 84,490 96,494 96,506 84,514" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="103" y="506" font-family="system-ui, -apple-system, monospace" font-size="12" font-weight="600" fill="rgba(255,255,255,0.55)">Fair &amp; Transparent</text>
  <text x="103" y="520" font-family="system-ui, -apple-system, monospace" font-size="10" fill="rgba(255,255,255,0.28)">Built for everyone</text>

  <!-- Divider -->
  <line x1="232" y1="494" x2="232" y2="522" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Globe icon -->
  <circle cx="248" cy="507" r="8" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <ellipse cx="248" cy="507" rx="4" ry="8" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <line x1="240" y1="507" x2="256" y2="507" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <text x="264" y="506" font-family="system-ui, -apple-system, monospace" font-size="12" font-weight="600" fill="rgba(255,255,255,0.55)">Decentralized</text>
  <text x="264" y="520" font-family="system-ui, -apple-system, monospace" font-size="10" fill="rgba(255,255,255,0.28)">On Quai Network</text>

  <!-- ══════════════════════════════════════
       RIGHT — Market Preview Card
  ══════════════════════════════════════ -->

  <!-- Card body -->
  <rect x="710" y="80" width="418" height="468" rx="20" fill="#111111" stroke="rgba(255,255,255,0.1)" stroke-width="1" filter="url(#cardShadow)"/>

  <!-- Card inner top glow -->
  <rect x="710" y="80" width="418" height="468" rx="20" fill="url(#rightGlow)" opacity="0.6"/>

  <!-- Live dot + label -->
  <circle cx="736" cy="118" r="4" fill="#22c55e"/>
  <text x="748" y="122" font-family="system-ui, -apple-system, monospace" font-size="11" font-weight="700" fill="rgba(255,255,255,0.35)" letter-spacing="0.1em">FEATURED MARKET</text>
  <text x="1080" y="122" font-family="system-ui, -apple-system, monospace" font-size="11" fill="rgba(255,255,255,0.35)" text-anchor="end">1h 24m</text>

  <!-- Category badge -->
  <rect x="726" y="136" width="62" height="20" rx="4" fill="rgba(167,139,250,0.12)"/>
  <text x="757" y="150" font-family="system-ui, -apple-system, monospace" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">Politics</text>

  <!-- Question text -->
  <text x="726" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="white" letter-spacing="-0.02em">Will the United States hold</text>
  <text x="726" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="white" letter-spacing="-0.02em">presidential elections in 2024?</text>

  <!-- Pool info -->
  <text x="726" y="232" font-family="system-ui, -apple-system, monospace" font-size="12" fill="rgba(255,255,255,0.3)">Pool: <tspan font-weight="600" fill="rgba(255,255,255,0.55)">$10,000</tspan></text>

  <!-- Divider -->
  <line x1="710" y1="252" x2="1128" y2="252" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- YES bar section -->
  <text x="726" y="278" font-family="system-ui, -apple-system, monospace" font-size="11" font-weight="700" fill="rgba(255,255,255,0.35)" letter-spacing="0.08em">YES</text>
  <text x="1112" y="278" font-family="system-ui, -apple-system, monospace" font-size="13" font-weight="800" fill="#22c55e" text-anchor="end">70%</text>
  <rect x="726" y="284" width="386" height="6" rx="3" fill="rgba(255,255,255,0.07)"/>
  <rect x="726" y="284" width="270" height="6" rx="3" fill="url(#yesGrad)"/>

  <!-- NO bar section -->
  <text x="726" y="316" font-family="system-ui, -apple-system, monospace" font-size="11" font-weight="700" fill="rgba(255,255,255,0.35)" letter-spacing="0.08em">NO</text>
  <text x="1112" y="316" font-family="system-ui, -apple-system, monospace" font-size="13" font-weight="800" fill="#ef4444" text-anchor="end">30%</text>
  <rect x="726" y="322" width="386" height="6" rx="3" fill="rgba(255,255,255,0.07)"/>
  <rect x="726" y="322" width="116" height="6" rx="3" fill="url(#noGrad)"/>

  <!-- Divider -->
  <line x1="710" y1="352" x2="1128" y2="352" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Stake input mock -->
  <text x="726" y="378" font-family="system-ui, -apple-system, monospace" font-size="11" font-weight="600" fill="rgba(255,255,255,0.3)" letter-spacing="0.06em">YOUR CONVICTION</text>

  <!-- YES button mock -->
  <rect x="726" y="390" width="182" height="52" rx="10" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.35)" stroke-width="1.5"/>
  <text x="817" y="421" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#22c55e" text-anchor="middle" letter-spacing="0.04em">YES</text>

  <!-- NO button mock -->
  <rect x="920" y="390" width="188" height="52" rx="10" fill="rgba(239,68,68,0.07)" stroke="rgba(239,68,68,0.2)" stroke-width="1.5"/>
  <text x="1014" y="421" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ef4444" text-anchor="middle" letter-spacing="0.04em">NO</text>

  <!-- Divider -->
  <line x1="710" y1="460" x2="1128" y2="460" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Bottom stat row inside card -->
  <text x="726" y="490" font-family="system-ui, -apple-system, monospace" font-size="11" fill="rgba(255,255,255,0.28)">Built on</text>
  <text x="726" y="506" font-family="system-ui, -apple-system, monospace" font-size="12" font-weight="700" fill="rgba(255,255,255,0.6)">Quai Network</text>

  <text x="919" y="490" font-family="system-ui, -apple-system, monospace" font-size="11" fill="rgba(255,255,255,0.28)" text-anchor="middle">On-chain</text>
  <text x="919" y="506" font-family="system-ui, -apple-system, monospace" font-size="12" font-weight="700" fill="rgba(255,255,255,0.6)" text-anchor="middle">Settlement</text>

  <text x="1112" y="490" font-family="system-ui, -apple-system, monospace" font-size="11" fill="rgba(255,255,255,0.28)" text-anchor="end">Non-custodial</text>
  <text x="1112" y="506" font-family="system-ui, -apple-system, monospace" font-size="12" font-weight="700" fill="rgba(255,255,255,0.6)" text-anchor="end">Your keys</text>

  <!-- ── Bottom domain bar ── -->
  <rect x="0" y="590" width="1200" height="40" fill="rgba(0,0,0,0.4)"/>
  <line x1="0" y1="590" x2="1200" y2="590" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="72" y="614" font-family="system-ui, -apple-system, monospace" font-size="13" font-weight="600" fill="rgba(255,255,255,0.35)" letter-spacing="0.02em">q4.app</text>
  <text x="1128" y="614" font-family="system-ui, -apple-system, monospace" font-size="12" fill="rgba(255,255,255,0.25)" text-anchor="end">Answer. Stake. Earn.</text>
</svg>
