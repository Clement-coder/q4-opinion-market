<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Dot grid -->
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.28)" />
    </pattern>
    <!-- Centre radial glow -->
    <radialGradient id="heroGlow" cx="58%" cy="50%" r="52%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Right ellipse glow -->
    <radialGradient id="rightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Card top glow -->
    <linearGradient id="cardTopGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- YES bar -->
    <linearGradient id="yesGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <!-- NO bar -->
    <linearGradient id="noGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <!-- Card shadow -->
    <filter id="cardShadow" x="-12%" y="-8%" width="124%" height="128%">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <!-- Logo purple glow -->
    <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#863bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#863bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── Base ── -->
  <rect width="1200" height="630" fill="#0d0d0d"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#heroGlow)"/>
  <ellipse cx="900" cy="315" rx="310" ry="265" fill="url(#rightGlow)"/>

  <!-- Scan lines -->
  <line x1="0" y1="94"  x2="1200" y2="94"  stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="0" y1="189" x2="1200" y2="189" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="0" y1="283" x2="1200" y2="283" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="0" y1="472" x2="1200" y2="472" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="240"  y1="0" x2="240"  y2="630" stroke="rgba(255,255,255,0.012)" stroke-width="1"/>
  <line x1="480"  y1="0" x2="480"  y2="630" stroke="rgba(255,255,255,0.012)" stroke-width="1"/>
  <line x1="720"  y1="0" x2="720"  y2="630" stroke="rgba(255,255,255,0.012)" stroke-width="1"/>
  <line x1="960"  y1="0" x2="960"  y2="630" stroke="rgba(255,255,255,0.012)" stroke-width="1"/>

  <!-- Corner accent -->
  <line x1="1200" y1="0" x2="1080" y2="0"  stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <line x1="1200" y1="0" x2="1200" y2="80" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- ══════════════════════════════
       LEFT COPY
  ══════════════════════════════ -->

  <!-- Q4 logo mark — exact SVG path from logo.svg, scaled ~2.4× at (68, 108) -->
  <ellipse cx="93" cy="165" rx="46" ry="46" fill="url(#logoGlow)"/>
  <g transform="translate(68, 118) scale(2.4)">
    <path fill="#863bff" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"/>
  </g>

  <!-- Q4 wordmark next to logo -->
  <text x="188" y="168" font-family="system-ui,-apple-system,sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">Q4</text>

  <!-- Pill badge -->
  <rect x="68" y="212" width="310" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <circle cx="90" cy="228" r="3.5" fill="rgba(255,255,255,0.5)"/>
  <text x="104" y="233" font-family="system-ui,-apple-system,monospace" font-size="12.5" fill="rgba(255,255,255,0.6)" letter-spacing="0.01em">Economic Conviction, Not Popularity</text>

  <!-- Headline -->
  <text x="68" y="318" font-family="system-ui,-apple-system,sans-serif" font-size="70" font-weight="800" fill="#ffffff" letter-spacing="-0.045em">Answer Today.</text>
  <text x="68" y="398" font-family="system-ui,-apple-system,sans-serif" font-size="70" font-weight="800" fill="rgba(255,255,255,0.32)" letter-spacing="-0.045em">Shape Tomorrow.</text>

  <!-- Body copy -->
  <text x="68" y="444" font-family="system-ui,-apple-system,monospace" font-size="14.5" fill="rgba(255,255,255,0.5)" letter-spacing="0.01em">Q4 is a prediction platform where your belief is measured</text>
  <text x="68" y="466" font-family="system-ui,-apple-system,monospace" font-size="14.5" fill="rgba(255,255,255,0.5)" letter-spacing="0.01em">by economic conviction, not the number of voters.</text>

  <!-- Trust strip -->
  <!-- Shield icon (hand-drawn) -->
  <path d="M74 512 L74 500 L84 496 L94 500 L94 512 L84 520 Z" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="102" y="508" font-family="system-ui,-apple-system,monospace" font-size="12" font-weight="600" fill="rgba(255,255,255,0.55)">Fair &amp; Transparent</text>
  <text x="102" y="522" font-family="system-ui,-apple-system,monospace" font-size="10.5" fill="rgba(255,255,255,0.28)">Built for everyone</text>

  <line x1="238" y1="498" x2="238" y2="526" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Globe icon -->
  <circle cx="254" cy="511" r="9" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <ellipse cx="254" cy="511" rx="4.5" ry="9" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <line x1="245" y1="511" x2="263" y2="511" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <text x="272" y="508" font-family="system-ui,-apple-system,monospace" font-size="12" font-weight="600" fill="rgba(255,255,255,0.55)">Decentralized</text>
  <text x="272" y="522" font-family="system-ui,-apple-system,monospace" font-size="10.5" fill="rgba(255,255,255,0.28)">On Quai Network</text>

  <line x1="385" y1="498" x2="385" y2="526" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Check icon -->
  <circle cx="401" cy="511" r="9" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <polyline points="396,511 400,515 407,507" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="418" y="508" font-family="system-ui,-apple-system,monospace" font-size="12" font-weight="600" fill="rgba(255,255,255,0.55)">Secure &amp; Reliable</text>
  <text x="418" y="522" font-family="system-ui,-apple-system,monospace" font-size="10.5" fill="rgba(255,255,255,0.28)">Your funds are safe</text>

  <!-- ══════════════════════════════
       RIGHT — Market Preview Card
  ══════════════════════════════ -->

  <!-- Card -->
  <rect x="695" y="62" width="436" height="502" rx="20" fill="#0f0f0f" stroke="rgba(255,255,255,0.09)" stroke-width="1" filter="url(#cardShadow)"/>

  <!-- Card top glow line -->
  <rect x="766" y="62" width="294" height="1" fill="url(#cardTopGlow)"/>

  <!-- Header bar -->
  <rect x="695" y="62" width="436" height="52" rx="20" fill="rgba(255,255,255,0.02)"/>
  <line x1="695" y1="114" x2="1131" y2="114" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <!-- Live dot -->
  <circle cx="718" cy="88" r="4.5" fill="#22c55e"/>
  <text x="731" y="93" font-family="system-ui,-apple-system,monospace" font-size="11" font-weight="700" fill="rgba(255,255,255,0.45)" letter-spacing="0.1em">POLITICS</text>
  <text x="1120" y="93" font-family="system-ui,-apple-system,monospace" font-size="11" fill="rgba(255,255,255,0.32)" text-anchor="end">1h 24m remaining</text>

  <!-- Question text -->
  <text x="718" y="152" font-family="system-ui,-apple-system,sans-serif" font-size="15.5" font-weight="600" fill="rgba(255,255,255,0.92)" letter-spacing="-0.015em">Will the United States hold presidential</text>
  <text x="718" y="172" font-family="system-ui,-apple-system,sans-serif" font-size="15.5" font-weight="600" fill="rgba(255,255,255,0.92)" letter-spacing="-0.015em">elections in 2024?</text>

  <!-- Pool -->
  <text x="718" y="200" font-family="system-ui,-apple-system,monospace" font-size="12" fill="rgba(255,255,255,0.28)">Total pool: <tspan font-weight="600" fill="rgba(255,255,255,0.55)">$10,000</tspan></text>

  <!-- Divider -->
  <line x1="695" y1="220" x2="1131" y2="220" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- YES/NO buttons -->
  <!-- YES -->
  <rect x="718" y="234" width="194" height="76" rx="14" fill="rgba(34,197,94,0.07)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
  <text x="815" y="269" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#22c55e" text-anchor="middle" letter-spacing="0.12em">YES</text>
  <text x="815" y="287" font-family="system-ui,-apple-system,monospace" font-size="11.5" fill="rgba(34,197,94,0.6)" text-anchor="middle">Believe it'll happen</text>

  <!-- NO -->
  <rect x="924" y="234" width="194" height="76" rx="14" fill="rgba(239,68,68,0.07)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <text x="1021" y="269" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#ef4444" text-anchor="middle" letter-spacing="0.12em">NO</text>
  <text x="1021" y="287" font-family="system-ui,-apple-system,monospace" font-size="11.5" fill="rgba(239,68,68,0.6)" text-anchor="middle">Doubt it'll happen</text>

  <!-- Divider -->
  <line x1="695" y1="328" x2="1131" y2="328" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Capital bars section -->
  <text x="718" y="358" font-family="system-ui,-apple-system,monospace" font-size="11" font-weight="700" fill="rgba(255,255,255,0.28)" letter-spacing="0.08em">CAPITAL CONVICTION</text>

  <!-- YES bar -->
  <text x="718" y="386" font-family="system-ui,-apple-system,monospace" font-size="11" font-weight="700" fill="#22c55e">YES</text>
  <text x="1120" y="386" font-family="system-ui,-apple-system,monospace" font-size="13" font-weight="800" fill="#22c55e" text-anchor="end">70%</text>
  <rect x="718" y="392" width="394" height="7" rx="3.5" fill="rgba(255,255,255,0.07)"/>
  <rect x="718" y="392" width="276" height="7" rx="3.5" fill="url(#yesGrad)"/>

  <!-- NO bar -->
  <text x="718" y="422" font-family="system-ui,-apple-system,monospace" font-size="11" font-weight="700" fill="#ef4444">NO</text>
  <text x="1120" y="422" font-family="system-ui,-apple-system,monospace" font-size="13" font-weight="800" fill="#ef4444" text-anchor="end">30%</text>
  <rect x="718" y="428" width="394" height="7" rx="3.5" fill="rgba(255,255,255,0.07)"/>
  <rect x="718" y="428" width="118" height="7" rx="3.5" fill="url(#noGrad)"/>

  <!-- Divider -->
  <line x1="695" y1="456" x2="1131" y2="456" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Stake CTA bar -->
  <rect x="718" y="470" width="394" height="46" rx="10" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="915" y="498" font-family="system-ui,-apple-system,monospace" font-size="13" font-weight="600" fill="rgba(255,255,255,0.3)" text-anchor="middle">Select YES or NO to stake</text>

  <!-- Footer info line -->
  <text x="718" y="538" font-family="system-ui,-apple-system,monospace" font-size="10.5" fill="rgba(255,255,255,0.2)">Conviction measured by capital staked, not number of participants.</text>

  <!-- ── Bottom bar ── -->
  <rect x="0" y="590" width="1200" height="40" fill="rgba(0,0,0,0.45)"/>
  <line x1="0" y1="590" x2="1200" y2="590" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="68" y="614" font-family="system-ui,-apple-system,monospace" font-size="13" font-weight="600" fill="rgba(255,255,255,0.35)" letter-spacing="0.02em">q4.app</text>
  <text x="1132" y="614" font-family="system-ui,-apple-system,monospace" font-size="12" fill="rgba(255,255,255,0.22)" text-anchor="end">Answer · Stake · Earn</text>
</svg>
