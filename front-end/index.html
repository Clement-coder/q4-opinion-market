<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Q4 Opinion Market — A 24-hour prediction market where users predict real-world outcomes, backed by live data and automatically resolved when the outcome is verified." />
  <meta name="theme-color" content="#080808" />

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
  <link rel="shortcut icon" href="/favicon.jpg" />

  <!-- Browser / PWA meta -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Q4" />

  <!-- Open Graph -->
  <meta property="og:title"       content="Q4 Opinion Market — Predict. Wait. Resolve." />
  <meta property="og:description" content="Q4 is a 24-hour prediction market where users predict real-world outcomes, backed by live data and automatically resolved when the outcome is verified." />
  <meta property="og:type"        content="website" />
  <meta property="og:image"       content="https://q4-network.web.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"   content="Q4 Opinion Market — Short-term prediction markets resolved by real-world data." />
  <meta property="og:site_name"   content="Q4 Opinion Market" />
  <meta property="og:url"         content="https://q4-network.web.app" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="Q4 Opinion Market — Predict. Wait. Resolve." />
  <meta name="twitter:description" content="Q4 is a 24-hour prediction market where users predict real-world outcomes, backed by live data and automatically resolved when the outcome is verified." />
  <meta name="twitter:image"       content="https://q4-network.web.app/og-image.png" />
  <meta name="twitter:image:alt"   content="Q4 Opinion Market — Short-term prediction markets." />

  <!-- Fonts: Yapari (display headlines) + Monorama (body + UI labels) + Barlow Condensed (market questions) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Yapari Trial — display headlines (cdnfonts) -->
  <link href="https://fonts.cdnfonts.com/css/yapari-trial" rel="stylesheet" />
  <!-- Monorama — body copy + UI labels / technical text (cdnfonts) -->
  <link href="https://fonts.cdnfonts.com/css/monorama" rel="stylesheet" />
  <!-- Barlow Condensed — market question text: sharp, bold, condensed, readable -->
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
